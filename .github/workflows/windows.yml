name: Windows build and verification
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare source files
        shell: pwsh
        run: |
          if (!(Test-Path 'package.json')) {
            $encoded = ''
            [IO.File]::WriteAllBytes('source.zip', [Convert]::FromBase64String($encoded))
            Expand-Archive source.zip -DestinationPath . -Force
            Remove-Item source.zip
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .
            git commit -m 'Add KarimDM source and tests'
            git push
          }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Full Windows UI and restart test
        run: npm run test:ui
      - name: Build portable Windows executable
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Launch and verify packaged portable EXE
        shell: pwsh
        run: |
          $env:KARIMDM_TEST_REPORT = Join-Path $env:GITHUB_WORKSPACE 'test-results\packaged-report.json'
          $env:KARIMDM_DATA = Join-Path $env:RUNNER_TEMP 'karimdm-packaged-state'
          $exe = Get-ChildItem dist\*.exe | Select-Object -First 1
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '--self-test' -PassThru
          $deadline = (Get-Date).AddMinutes(3)
          while (!(Test-Path $env:KARIMDM_TEST_REPORT) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          if (!(Test-Path $env:KARIMDM_TEST_REPORT)) { throw 'Packaged EXE diagnostic did not finish' }
          $result = Get-Content $env:KARIMDM_TEST_REPORT -Raw | ConvertFrom-Json
          Get-Content $env:KARIMDM_TEST_REPORT
          if (!$result.passed -or !$result.packaged -or $result.platform -ne 'win32') { throw 'Packaged EXE verification failed' }
          Get-FileHash $exe.FullName -Algorithm SHA256 | ForEach-Object { $_.Hash.ToLower() + '  ' + $exe.Name } | Set-Content dist\SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-verification
          path: test-results/
      - name: Publish verified release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0.1
          if ($LASTEXITCODE -eq 0) { throw 'Release v1.0.1 already exists. Review before replacing binaries.' }
          gh release create v1.0.1 dist/*.exe dist/SHA256SUMS.txt --title 'KarimDM 1.0.1' --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
